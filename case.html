<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case File — Diagnostic Interview Simulation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1E9D2; --paper-dark:#E3D5AE; --folder:#D8C393; --ink:#2B2A25; --ink-soft:#5C5648;
    --navy:#2F4858; --red:#A13D3D; --sage:#5E7A52; --line:#C7B78E; --white-card:#FBF7EC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.03) 0, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,0.03) 0, transparent 40%);
    color:var(--ink); font-family:'Space Grotesk', sans-serif; min-height:100vh; padding:28px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .session-banner{
    background:var(--navy); color:var(--white-card); font-family:'Courier Prime', monospace;
    font-size:0.8rem; padding:8px 16px; border-radius:6px; margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .session-banner a{color:var(--white-card); opacity:0.8;}
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:6px;}
  .masthead h1{font-size:1.15rem;letter-spacing:0.08em;text-transform:uppercase;margin:0;font-weight:700;}
  .case-num{font-family:'Courier Prime', monospace;font-size:0.85rem;color:var(--ink-soft);}
  .subline{font-family:'Courier Prime', monospace;font-size:0.78rem;color:var(--ink-soft);margin-bottom:26px;letter-spacing:0.02em;}
  .tabs{display:flex;gap:6px;margin-bottom:-1px;flex-wrap:wrap;}
  .tab{
    font-family:'Courier Prime', monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;
    padding:7px 14px;border:1px solid var(--line);border-bottom:none;background:var(--paper-dark);
    color:var(--ink-soft);border-radius:6px 6px 0 0;opacity:0.55;
  }
  .tab.active{background:var(--white-card);color:var(--ink);opacity:1;font-weight:700;border-color:var(--ink);}
  .panel{background:var(--white-card);border:1px solid var(--ink);border-radius:0 8px 8px 8px;padding:28px;box-shadow:4px 4px 0 rgba(43,42,37,0.08);}
  .screen{display:none;}
  .screen.active{display:block;animation:fadein 0.35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .stamp{
    display:inline-block;border:2px solid var(--red);color:var(--red);font-family:'Courier Prime', monospace;
    font-weight:700;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;padding:4px 10px;
    border-radius:3px;transform:rotate(-3deg);margin-bottom:16px;
  }
  h2{font-size:1.3rem;margin:0 0 12px;}
  h3{font-size:0.95rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:22px 0 10px;}
  p{line-height:1.6;font-size:0.98rem;}
  .note{
    font-family:'Courier Prime', monospace;background:var(--paper-dark);border-left:3px solid var(--navy);
    padding:12px 16px;margin:10px 0;font-size:0.9rem;line-height:1.55;border-radius:0 4px 4px 0;
  }
  .bg-section{
    background:var(--white-card); border:1px solid var(--line); border-left:3px solid var(--ink-soft);
    border-radius:0 4px 4px 0; padding:12px 16px; margin:10px 0;
  }
  .bg-section .bg-label{
    font-family:'Courier Prime', monospace; font-size:0.72rem; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink-soft); font-weight:700; margin-bottom:4px;
  }
  .bg-section p{margin:0; font-size:0.92rem;}
  .choice-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  button.choice{
    text-align:left;background:var(--white-card);border:1px solid var(--ink);border-radius:6px;padding:12px 16px;
    font-family:'Space Grotesk', sans-serif;font-size:0.92rem;font-weight:500;cursor:pointer;color:var(--ink);
    transition:transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;box-shadow:2px 2px 0 rgba(43,42,37,0.15);
  }
  button.choice:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(43,42,37,0.25);background:var(--paper);}
  button.choice:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  button.choice:disabled{opacity:0.4;cursor:default;}
  button.choice.asked{opacity:0.45;}
  button.choice .tag{display:block;font-family:'Courier Prime', monospace;font-size:0.7rem;color:var(--ink-soft);margin-top:3px;}
  .primary-btn{
    font-family:'Space Grotesk', sans-serif;font-weight:600;font-size:0.92rem;background:var(--navy);
    color:var(--white-card);border:none;border-radius:6px;padding:12px 22px;cursor:pointer;margin-top:20px;
    box-shadow:2px 2px 0 rgba(43,42,37,0.3);
  }
  .primary-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(43,42,37,0.4);}
  .primary-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .ghost-btn{
    font-family:'Courier Prime', monospace;font-size:0.8rem;background:none;border:1px solid var(--ink-soft);
    color:var(--ink-soft);border-radius:5px;padding:8px 14px;cursor:pointer;margin-top:14px;
  }
  .layout{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:720px){.layout{grid-template-columns:1.5fr 1fr;}}
  .notes-textarea{
    width:100%;min-height:160px;font-family:'Courier Prime', monospace;font-size:0.88rem;background:var(--white-card);
    border:1px solid var(--ink);border-radius:6px;padding:12px;line-height:1.5;resize:vertical;color:var(--ink);
  }
  .notes-textarea:focus-visible{outline:2px solid var(--navy);outline-offset:1px;}
  .clipboard{background:var(--folder);border:1px solid var(--ink);border-radius:8px;padding:16px 18px;height:fit-content;}
  .clipboard h3{margin-top:0;color:var(--ink);}
  .clipboard-hint{font-family:'Courier Prime', monospace;font-size:0.72rem;color:var(--ink-soft);margin:-4px 0 12px;line-height:1.5;}
  .checklist{list-style:none;margin:0;padding:0;font-family:'Courier Prime', monospace;font-size:0.82rem;}
  .checklist li{
    display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed rgba(43,42,37,0.25);
    color:var(--ink-soft);cursor:pointer;user-select:none;background:none;border-top:none;border-left:none;
    border-right:none;width:100%;font-family:'Courier Prime', monospace;font-size:0.82rem;text-align:left;
  }
  .checklist li:hover{color:var(--ink);}
  .checklist li:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .checklist li.checked{color:var(--ink);font-weight:700;}
  .checklist .box{
    flex:0 0 16px;height:16px;border:1.5px solid var(--ink-soft);border-radius:3px;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:0.7rem;
  }
  .checklist li.checked .box{background:var(--sage);border-color:var(--sage);color:white;}
  .progress{font-family:'Courier Prime', monospace;font-size:0.75rem;color:var(--ink-soft);margin-top:14px;}
  .notes-recap{
    font-family:'Courier Prime', monospace;font-size:0.88rem;line-height:1.6;background:var(--paper-dark);
    border-left:3px solid var(--navy);border-radius:0 4px 4px 0;padding:14px 16px;white-space:pre-wrap;
    margin:12px 0 22px;color:var(--ink);
  }
  .notes-recap.empty{color:var(--ink-soft);font-style:italic;}
  .symptom-columns{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:720px){.symptom-columns{grid-template-columns:1fr 1fr;}}
  .symptom-columns .clipboard{margin-bottom:0;}
  .dx-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;}
  @media(min-width:640px){.dx-grid{grid-template-columns:1fr 1fr;}}
  button.dx{
    text-align:left;background:var(--white-card);border:1px solid var(--ink);border-radius:6px;padding:16px;
    cursor:pointer;font-family:'Space Grotesk', sans-serif;
  }
  button.dx strong{display:block;font-size:1rem;margin-bottom:4px;}
  button.dx span{font-size:0.82rem;color:var(--ink-soft);font-family:'Courier Prime', monospace;}
  button.dx:hover{background:var(--paper);}
  .verdict{
    display:inline-block;padding:6px 14px;border-radius:4px;font-family:'Courier Prime', monospace;font-weight:700;
    font-size:0.85rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:14px;
  }
  .verdict.correct{background:var(--sage);color:white;}
  .verdict.miss{background:var(--red);color:white;}
  .why-grid{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px;}
  button.why-chip{
    font-family:'Courier Prime', monospace;font-size:0.82rem;background:var(--white-card);
    border:1.5px solid var(--ink-soft);border-radius:20px;padding:8px 16px;cursor:pointer;color:var(--ink-soft);
  }
  button.why-chip:hover:not(:disabled){border-color:var(--ink);color:var(--ink);}
  button.why-chip.selected{background:var(--navy);border-color:var(--navy);color:white;font-weight:700;}
  button.why-chip:disabled:not(.selected){opacity:0.35;cursor:not-allowed;}
  .why-count{font-family:'Courier Prime', monospace;font-size:0.75rem;color:var(--ink-soft);margin-top:12px;}
  .debrief{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px;}
  .debrief h3{margin-top:0;}
  .supervisor-note{
    background:var(--folder); border-left:4px solid var(--ink); border-radius:0 6px 6px 0;
    padding:16px 18px; margin:16px 0; font-family:'Courier Prime', monospace; font-size:0.9rem;
    line-height:1.6; color:var(--ink);
  }
  .supervisor-note p{margin:0;}
  .supervisor-signature{
    margin-top:10px !important; text-align:right; font-style:italic; color:var(--ink-soft); font-size:0.85rem;
  }
  .save-status{font-family:'Courier Prime', monospace;font-size:0.8rem;margin-top:16px;padding:10px 14px;border-radius:5px;}
  .save-status.saved{background:#E4EDE1;color:#3E5233;}
  .save-status.error{background:#F4E1E1;color:#7A2E2E;}
  .loading-msg{font-family:'Courier Prime', monospace;color:var(--ink-soft);}
  footer{text-align:center;font-family:'Courier Prime', monospace;font-size:0.72rem;color:var(--ink-soft);margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="session-banner" id="session-banner">Loading session...</div>

  <div id="app-content">
    <p class="loading-msg">Loading case file...</p>
  </div>

  <footer>Fictional case for classroom use &middot; not a diagnostic tool &middot; always defer to a licensed clinician for real assessment</footer>
</div>

<script src="js/supabase-config.js"></script>
<script>
// ---------- session check ----------
const rawSession = localStorage.getItem('studentSession');
let studentSession = null;

if(!rawSession){
  window.location.href = 'join.html';
} else {
  studentSession = JSON.parse(rawSession);
  document.getElementById('session-banner').innerHTML =
    `Signed in as <strong>${studentSession.nickname}</strong> — ${studentSession.className} &nbsp;|&nbsp; <a href="join.html">Not you? Switch class</a>`;

  if(!studentSession.activityId){
    document.getElementById('app-content').innerHTML =
      '<p class="loading-msg">This session was created before case data was supported. Please <a href="join.html">rejoin your class</a>.</p>';
  } else {
    loadCaseScript(studentSession.activityId);
  }
}

function loadCaseScript(activityId){
  const script = document.createElement('script');
  script.src = 'cases/' + activityId + '.js';
  script.onload = () => {
    if(window.CASE_DATA){
      buildApp(window.CASE_DATA);
    } else {
      showLoadError('Case data did not load correctly.');
    }
  };
  script.onerror = () => showLoadError('Could not find a case file for "' + activityId + '".');
  document.head.appendChild(script);
}

function showLoadError(msg){
  document.getElementById('app-content').innerHTML =
    '<p class="loading-msg">' + msg + ' Please check with your teacher.</p>';
}

// ---------- build the whole app once case data is loaded ----------
function buildApp(CASE){

  document.getElementById('app-content').innerHTML = `
    <div class="masthead">
      <h1>School Psychological Services — Case File</h1>
      <span class="case-num">FILE #${CASE.id}</span>
    </div>
    <div class="subline">CONFIDENTIAL &middot; DIAGNOSTIC INTERVIEW TRAINING SIMULATION &middot; FICTIONAL CLIENT</div>

    <div class="tabs">
      <div class="tab active" id="tab-intro">Referral</div>
      <div class="tab" id="tab-interview">Interview</div>
      <div class="tab" id="tab-synthesis">Symptoms</div>
      <div class="tab" id="tab-dx">Diagnosis</div>
      <div class="tab" id="tab-why">Reasoning</div>
      <div class="tab" id="tab-outcome">Outcome</div>
    </div>

    <div class="panel">
      <div class="screen active" id="screen-intro">
        <span class="stamp">New Referral</span>
        <h2>Referral Note</h2>
        <div class="note">
          Client: ${CASE.referral.clientLine}<br>
          Referred by: ${CASE.referral.referredBy}<br><br>
          Reason for referral: ${CASE.referral.reason}
        </div>
        <h3>Background File</h3>
        <div id="background-sections"></div>
        <p>You are the psychology intern assigned to conduct the initial diagnostic interview. Ask thoughtful questions, take your own notes on what you hear, and later you'll synthesize those notes into a working diagnostic impression — the same process a clinician follows before ever settling on a label.</p>
        <p>Read the background carefully. Some details may seem to point toward an obvious explanation — real backgrounds often do. That doesn't mean the obvious explanation is the right one.</p>
        <button class="primary-btn" id="btn-start">Begin the interview →</button>
      </div>

      <div class="screen" id="screen-interview">
        <h2>Interview Room</h2>
        <p>Choose questions to ask. Each question can only be asked once, and disappears from the list after you ask it. The answer you get will only stay on screen until you ask your next question — so write down what matters in the notes box before moving on.</p>
        <div class="layout">
          <div>
            <div class="choice-list" id="question-list"></div>
          </div>
          <div>
            <div class="clipboard">
              <h3>Interview Responses</h3>
              <p class="clipboard-hint">Shows the most recent answer. It disappears once you ask your next question — write down what matters before moving on.</p>
              <div id="notes-log"></div>
            </div>
            <div class="clipboard" style="margin-top:16px;">
              <h3>Your Clinical Notes</h3>
              <p class="clipboard-hint">Jot down symptoms and observations as you hear them. Nothing is filled in for you.</p>
              <textarea class="notes-textarea" id="clinical-notes" placeholder="Write what you're noticing..."></textarea>
            </div>
          </div>
        </div>
        <div class="progress" id="progress-text">0 of ${CASE.questions.length} areas explored</div>
        <button class="primary-btn" id="btn-to-synthesis" disabled>Review your notes →</button>
      </div>

      <div class="screen" id="screen-synthesis">
        <h2>Synthesize Your Findings</h2>
        <p>Here's what you wrote during the interview. Using your own notes, check off which symptoms you believe this case actually meets.</p>
        <div class="notes-recap" id="notes-recap"></div>
        <div class="symptom-columns">
          <div class="clipboard">
            <h3>${CASE.gadColumnTitle}</h3>
            <ul class="checklist" id="gad-checklist"></ul>
          </div>
          <div class="clipboard">
            <h3>${CASE.mddColumnTitle}</h3>
            <ul class="checklist" id="mdd-checklist"></ul>
          </div>
        </div>
        <div class="clipboard" style="margin-top:18px;">
          <h3>Other Considerations</h3>
          <ul class="checklist" id="other-checklist"></ul>
        </div>
        <button class="primary-btn" id="btn-to-dx">Form a diagnosis →</button>
      </div>

      <div class="screen" id="screen-dx">
        <h2>What's your diagnostic impression?</h2>
        <p>Based on your notes and checklist, which best fits the pattern of symptoms?</p>
        <div class="dx-grid" id="dx-grid"></div>
      </div>

      <div class="screen" id="screen-why">
        <h2>What made up your mind?</h2>
        <p>From what you personally checked off, pick up to 3 pieces of evidence that mattered most to your diagnosis.</p>
        <div id="why-options"></div>
        <button class="primary-btn" id="btn-why-continue">See outcome →</button>
      </div>

      <div class="screen" id="screen-outcome">
        <div id="verdict-badge"></div>
        <h2 id="outcome-title"></h2>
        <div id="outcome-body"></div>
        <div id="save-status" class="save-status">Saving your results...</div>
        <button class="ghost-btn" id="btn-restart">↺ Start over with a new intern</button>
      </div>
    </div>
  `;

  document.title = 'Case File ' + CASE.id;

  const bgContainer = document.getElementById('background-sections');
  if(CASE.referral.background && CASE.referral.background.length){
    CASE.referral.background.forEach(section => {
      const div = document.createElement('div');
      div.className = 'bg-section';
      div.innerHTML = `<div class="bg-label">${section.label}</div><p>${section.text}</p>`;
      bgContainer.appendChild(div);
    });
  }

  const state = { asked: new Set() };
  const allLabels = Object.assign({}, CASE.gadLabels, CASE.mddLabels, CASE.otherLabels);
  const trueCriteria = new Set(Object.keys(CASE.symptomTruth).filter(k => CASE.symptomTruth[k]));
  const studentChecks = new Set();
  let selectedDx = null;
  const whyChoices = new Set();

  const qList = document.getElementById('question-list');
  CASE.questions.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `${q.text}<span class="tag">${q.tag}</span>`;
    btn.addEventListener('click', () => askQuestion(q, btn));
    qList.appendChild(btn);
  });

  function askQuestion(q, btn){
    if(state.asked.has(q.id)) return;
    state.asked.add(q.id);
    btn.remove();

    const notesLog = document.getElementById('notes-log');
    notesLog.innerHTML = '';
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = q.note;
    notesLog.appendChild(note);

    document.getElementById('progress-text').textContent = `${state.asked.size} of ${CASE.questions.length} areas explored`;
    document.getElementById('btn-to-synthesis').disabled = state.asked.size < 3;
  }

  function buildChecklist(containerEl, labelMap){
    Object.entries(labelMap).forEach(([key,label]) => {
      if(document.getElementById('crit-'+key)) return;
      const li = document.createElement('li');
      li.id = 'crit-'+key;
      li.setAttribute('role','checkbox'); li.setAttribute('aria-checked','false'); li.tabIndex = 0;
      li.innerHTML = `<span class="box"></span><span>${label}</span>`;
      const toggle = () => {
        if(studentChecks.has(key)){
          studentChecks.delete(key);
          li.classList.remove('checked'); li.querySelector('.box').textContent=''; li.setAttribute('aria-checked','false');
        } else {
          studentChecks.add(key);
          li.classList.add('checked'); li.querySelector('.box').textContent='✓'; li.setAttribute('aria-checked','true');
        }
      };
      li.addEventListener('click', toggle);
      li.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
      containerEl.appendChild(li);
    });
  }
  buildChecklist(document.getElementById('gad-checklist'), CASE.gadLabels);
  buildChecklist(document.getElementById('mdd-checklist'), CASE.mddLabels);
  buildChecklist(document.getElementById('other-checklist'), CASE.otherLabels);

  function renderSynthesis(){
    const notesVal = document.getElementById('clinical-notes').value.trim();
    const recap = document.getElementById('notes-recap');
    if(notesVal){
      recap.textContent = notesVal;
      recap.classList.remove('empty');
    } else {
      recap.textContent = 'You didn\'t write any notes during the interview. That\'s okay — use what you remember from the transcript to fill out the checklist below.';
      recap.classList.add('empty');
    }
  }

  const dxGrid = document.getElementById('dx-grid');
  CASE.dxOptions.forEach(dx => {
    const btn = document.createElement('button');
    btn.className = 'dx';
    btn.innerHTML = `<strong>${dx.name}</strong><span>${dx.blurb}</span>`;
    btn.addEventListener('click', () => { selectedDx = dx; renderWhyScreen(); goTo('why'); });
    dxGrid.appendChild(btn);
  });

  function renderWhyScreen(){
    whyChoices.clear();
    const container = document.getElementById('why-options');
    container.innerHTML = '';
    if(studentChecks.size === 0){
      container.innerHTML = '<p>You didn\'t check off any checklist evidence — that\'s okay, just continue to see how your diagnosis holds up.</p>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'why-grid';
    [...studentChecks].forEach(key => {
      const chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'why-chip'; chip.textContent = allLabels[key];
      chip.addEventListener('click', () => toggleWhy(key, chip));
      grid.appendChild(chip);
    });
    container.appendChild(grid);
    const count = document.createElement('div');
    count.className = 'why-count'; count.id = 'why-count'; count.textContent = '0 of 3 selected';
    container.appendChild(count);
  }

  function toggleWhy(key, chip){
    if(whyChoices.has(key)){
      whyChoices.delete(key); chip.classList.remove('selected');
    } else {
      if(whyChoices.size >= 3) return;
      whyChoices.add(key); chip.classList.add('selected');
    }
    document.getElementById('why-count').textContent = `${whyChoices.size} of 3 selected`;
    document.querySelectorAll('.why-chip').forEach(c => {
      if(!c.classList.contains('selected')) c.disabled = whyChoices.size >= 3;
    });
  }

  document.getElementById('btn-why-continue').addEventListener('click', () => showOutcome(selectedDx));

  async function showOutcome(dx){
    const badge = document.getElementById('verdict-badge');
    const title = document.getElementById('outcome-title');
    const body = document.getElementById('outcome-body');
    body.innerHTML = '';

    if(dx.correct){
      badge.innerHTML = '<span class="verdict correct">Strong Fit</span>';
      title.textContent = 'Diagnostic impression: ' + dx.name;
    } else {
      badge.innerHTML = '<span class="verdict miss">Worth Reconsidering</span>';
      title.textContent = dx.name + ' — not the best fit';
    }

    // Supervisor reaction — based on thoroughness (share of questions asked), not just correctness
    const thoroughness = state.asked.size / CASE.questions.length;
    let tier;
    if(thoroughness >= 0.75) tier = 'thorough';
    else if(thoroughness >= 0.5) tier = 'moderate';
    else tier = 'minimal';

    const supervisorLines = {
      correct: {
        thorough: `Nice work. You built this diagnosis on a genuinely full picture — you covered most of the interview before committing to an impression, and it shows. That's the habit that separates a good clinician from a lucky guess.`,
        moderate: `You landed on the right diagnosis, and that's worth something — but you got there with less than you could have gathered. It happened to work out this time; make sure it's the thoroughness doing the work next time, not the luck.`,
        minimal: `You got the right answer, but honestly, you didn't give yourself much to work with — only a handful of questions asked before jumping to a conclusion. In a real interview, that's how confident-sounding wrong diagnoses happen. This one just happened to land.`
      },
      incorrect: {
        thorough: `You did the hard part right — you explored almost everything before committing. The diagnosis itself didn't land, but that's a process I can work with. A misread on a solid workup is a much easier fix than a rushed one.`,
        moderate: `You explored a fair amount, but not quite enough to catch the full pattern here. Worth going back through and asking what you skipped — the answer was likely sitting in an area you didn't get to.`,
        minimal: `This is the one I want you to sit with: you asked very few questions before deciding. The diagnosis was off, and I don't think that's a coincidence. Slow down next time — the evidence really does change the answer.`
      }
    };

    let supervisorText = supervisorLines[dx.correct ? 'correct' : 'incorrect'][tier];

    const notesEmpty = document.getElementById('clinical-notes').value.trim().length === 0;
    if(notesEmpty){
      supervisorText += ` One more thing — you didn't write anything in your notes during the interview. Since each answer disappears once you move on, that's going to catch up with you on a longer case.`;
    }

    const supervisorBlock = document.createElement('div');
    supervisorBlock.className = 'supervisor-note';
    supervisorBlock.innerHTML = `<p>${supervisorText}</p><p class="supervisor-signature">— Dr. Alvarez, Clinical Supervisor</p>`;
    body.appendChild(supervisorBlock);

    const mainExplain = document.createElement('p');
    mainExplain.textContent = dx.explain;
    body.appendChild(mainExplain);

    if(!dx.correct){
      const correctOne = CASE.dxOptions.find(d => d.correct);
      const followup = document.createElement('div');
      followup.className = 'note';
      followup.innerHTML = `The best-fitting diagnosis for this case was <strong>${correctOne.name}</strong>. ${correctOne.explain}`;
      body.appendChild(followup);
    }

    const coverage = document.createElement('p');
    coverage.style.marginTop = '18px'; coverage.style.fontSize = '0.85rem'; coverage.style.color = 'var(--ink-soft)';
    coverage.textContent = state.asked.size < CASE.questions.length
      ? `You explored ${state.asked.size} of ${CASE.questions.length} interview areas. Try the case again and ask everything for the fullest picture.`
      : `You explored every area of the interview — nice thorough work.`;
    body.appendChild(coverage);

    const matched = [...studentChecks].filter(c => trueCriteria.has(c));
    const missed = [...trueCriteria].filter(c => !studentChecks.has(c));
    const falsePos = [...studentChecks].filter(c => !trueCriteria.has(c));

    const scoreBlock = document.createElement('div');
    scoreBlock.className = 'note';
    let scoreHtml = `<strong>Checklist accuracy: ${matched.length} of ${trueCriteria.size} true symptoms correctly identified.</strong>`;
    if(missed.length) scoreHtml += `<br>Missed: ${missed.map(c => allLabels[c]).join(', ')}.`;
    if(falsePos.length) scoreHtml += `<br>Checked but not actually supported: ${falsePos.map(c => allLabels[c]).join(', ')} — worth re-reading those notes.`;
    if(!missed.length && !falsePos.length) scoreHtml += `<br>Clean read of the case — every box matched the evidence.`;
    scoreBlock.innerHTML = scoreHtml;
    body.appendChild(scoreBlock);

    if(whyChoices.size > 0){
      const reasonBlock = document.createElement('div');
      reasonBlock.className = 'note';
      const chosenLabels = [...whyChoices].map(k => allLabels[k]);
      let reasonHtml = `<strong>Your stated reasoning:</strong> ${chosenLabels.join(', ')}.`;
      const trapKey = CASE.trapCriterionKey;
      if(trapKey && whyChoices.has(trapKey)){
        reasonHtml += `<br><br>Worth a second look: that piece of evidence was designed as a trap — see the debrief below for why.`;
      } else if(trapKey && studentChecks.has(trapKey)){
        reasonHtml += `<br><br>Nice catch leaving that trap item out of your key reasoning — see the debrief below.`;
      }
      reasonBlock.innerHTML = reasonHtml;
      body.appendChild(reasonBlock);
    }

    const debrief = document.createElement('div');
    debrief.className = 'debrief';
    debrief.innerHTML = `<h3>Debrief</h3><p style="font-size:0.85rem;color:var(--ink-soft);">${CASE.debriefTrapText}</p>`;
    body.appendChild(debrief);

    goTo('outcome');

    const saveStatusEl = document.getElementById('save-status');
    saveStatusEl.textContent = 'Saving your results...';
    saveStatusEl.className = 'save-status';

    const { error } = await sb.from('case_attempts').insert({
      student_session_id: studentSession.sessionId,
      case_id: CASE.id,
      notes: document.getElementById('clinical-notes').value,
      checklist_selections: [...studentChecks],
      reasoning_selections: [...whyChoices],
      diagnosis: dx.name,
      was_correct: dx.correct
    });

    if(error){
      saveStatusEl.textContent = 'Your results were not saved: ' + error.message + '. Take a screenshot to show your teacher just in case.';
      saveStatusEl.className = 'save-status error';
    } else {
      saveStatusEl.textContent = 'Your results have been saved. Your teacher can see this in their dashboard.';
      saveStatusEl.className = 'save-status saved';
    }
  }

  function goTo(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('screen-'+name).classList.add('active');
    document.getElementById('tab-'+name).classList.add('active');
  }

  document.getElementById('btn-start').addEventListener('click', () => goTo('interview'));
  document.getElementById('btn-to-synthesis').addEventListener('click', () => { renderSynthesis(); goTo('synthesis'); });
  document.getElementById('btn-to-dx').addEventListener('click', () => goTo('dx'));

  document.getElementById('btn-restart').addEventListener('click', () => {
    state.asked.clear(); studentChecks.clear(); whyChoices.clear(); selectedDx = null;
    document.getElementById('notes-log').innerHTML = '';
    document.getElementById('clinical-notes').value = '';

    // Rebuild the question list since asked questions were removed, not just disabled
    const qListEl = document.getElementById('question-list');
    qListEl.innerHTML = '';
    CASE.questions.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.innerHTML = `${q.text}<span class="tag">${q.tag}</span>`;
      btn.addEventListener('click', () => askQuestion(q, btn));
      qListEl.appendChild(btn);
    });

    document.querySelectorAll('.checklist li').forEach(li => { li.classList.remove('checked'); li.querySelector('.box').textContent=''; li.setAttribute('aria-checked','false'); });
    document.getElementById('progress-text').textContent = `0 of ${CASE.questions.length} areas explored`;
    document.getElementById('btn-to-synthesis').disabled = true;
    goTo('intro');
  });
}
</script>
</body>
</html>
