<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — Psychology Case Simulations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site-theme.css">
<style>
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(135deg, var(--lavender-50) 0%, #EFEBFF 100%);
  }
  .mini-logo{margin-bottom:26px;}
  .login-card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:34px 32px; max-width:380px; width:100%;
    box-shadow:var(--shadow-md);
  }
  .login-card h1{font-size:1.3rem; font-weight:800; margin:0 0 8px;}
  .login-card p{color:var(--ink-soft); font-size:0.9rem; line-height:1.55; margin:0 0 20px;}
  .login-card input{
    width:100%; padding:12px 14px; margin:0 0 14px; border:1px solid var(--line);
    border-radius:9px; font-size:0.95rem; box-sizing:border-box; font-family:'Inter', sans-serif; color:var(--ink);
  }
  .login-card input:focus{outline:2px solid var(--indigo-500); outline-offset:1px; border-color:var(--indigo-500);}
  .login-card button{width:100%;}
  .login-card button:disabled{opacity:0.55; cursor:default;}
  .message{margin-top:14px; font-size:0.86rem; padding:11px 13px; border-radius:9px; font-weight:500;}
  .message.success{background:var(--green-bg); color:var(--green);}
  .message.error{background:var(--rose-bg); color:var(--rose);}
</style>
</head>
<body>
  <a href="index.html" class="logo mini-logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="7" fill="#5B4FE5"/><path d="M12 6.5c-1.8 0-3 1.2-3.1 2.6-.9.3-1.5 1.2-1.5 2.1 0 .5.2 1 .5 1.4-.3.4-.5.9-.5 1.4 0 1.1.9 2 2 2.1.2.9 1 1.5 1.9 1.5.4 0 .8-.1 1.1-.4.3.3.7.4 1.1.4.9 0 1.7-.6 1.9-1.5 1.1-.1 2-1 2-2.1 0-.5-.2-1-.5-1.4.3-.4.5-.9.5-1.4 0-.9-.6-1.8-1.5-2.1-.1-1.4-1.3-2.6-3-2.6z" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 6.5v10.6M9.4 10.4c.7.3 1.6.3 2.6.1M14.6 10.4c-.7.3-1.6.3-2.6.1M9 13.6c.9.4 2 .4 3 .1M15 13.6c-.9.4-2 .4-3 .1" stroke="#fff" stroke-width="0.9" stroke-linecap="round"/></svg>
    <span>Psych Sims<span class="sub">Simulation Lab</span></span>
  </a>

  <div class="login-card">
    <h1>Teacher Login</h1>
    <p>Enter your email and we'll send you a one-time login link — no password needed.</p>
    <input type="email" id="email-input" placeholder="you@school.edu" autocomplete="email">
    <button id="login-btn" class="btn-primary" style="justify-content:center;">Send login link</button>
    <div id="message"></div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script>
    const btn = document.getElementById('login-btn');
    const emailInput = document.getElementById('email-input');
    const messageEl = document.getElementById('message');

    btn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if(!email){
        showMessage('Please enter your email.', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href.replace(/[^/]*$/, '') + 'dashboard.html' }
      });

      if(error){
        showMessage('Something went wrong: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Send login link';
      } else {
        showMessage('Check your email for a login link!', 'success');
        btn.textContent = 'Link sent';
      }
    });

    function showMessage(text, type){
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    // If already logged in, skip straight to the dashboard
    sb.auth.getSession().then(({ data }) => {
      if(data.session){
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
